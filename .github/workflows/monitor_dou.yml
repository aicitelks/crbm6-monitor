name: Monitorar Publicações DOU

on:
  schedule:
    # Roda a cada 6 horas (horário UTC). Ajuste como quiser.
    - cron: "30 */6 * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar monitor do DOU
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python monitor_dou.py

      - name: Salvar novo estado (se mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f state_dou.json ]; then
            git add state_dou.json
          fi
          git diff --staged --quiet || git commit -m "Atualiza estado do monitor DOU"
          git push
